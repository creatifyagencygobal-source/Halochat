<!doctype html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#090b14"><meta name="apple-mobile-web-app-capable" content="yes"><title>Halo</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.svg">
<link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/components.css"><script src="/js/theme.js"></script></head><body>
<div class="ambient" aria-hidden="true"></div><main id="app" class="app-shell" aria-live="polite">
<section id="explore-view" class="app-view"><header class="view-header"><div><p class="eyebrow">Discover</p><h1>Explore</h1></div></header><label class="search-box"><span data-icon="search"></span><span class="sr-only">Search users</span><input id="user-search" type="search" placeholder="Search by username…" autocomplete="off"></label><section class="section-block"><div class="section-heading"><h2 id="explore-heading">Recent people</h2><span id="explore-count"></span></div><div id="explore-results" class="people-list"></div></section></section>
<section id="chats-view" class="app-view active"><header class="view-header"><div><p class="eyebrow">Messages</p><h1>Chats</h1></div><button class="icon-button raised" data-action="new-chat" aria-label="New conversation"><span data-icon="plus"></span></button></header><label class="search-box"><span data-icon="search"></span><span class="sr-only">Search conversations</span><input id="chat-search" type="search" placeholder="Search conversations…" autocomplete="off"></label><div id="conversation-list" class="conversation-list"></div></section>
<section id="profile-view" class="app-view"><header class="view-header"><div><p class="eyebrow">Your space</p><h1>Profile</h1></div></header><div id="profile-content"></div></section>
<section id="chat-view" class="chat-view" aria-label="Conversation"><header class="chat-header glass"><button class="icon-button" data-action="back" aria-label="Back"><span data-icon="back"></span></button><div id="chat-avatar"></div><div class="chat-identity"><strong id="chat-title"></strong><span id="chat-subtitle"></span></div><button class="icon-button" data-action="chat-menu" aria-label="Conversation menu"><span data-icon="more"></span></button></header><div id="message-list" class="message-list"></div><form id="composer" class="composer glass"><button class="icon-button" type="button" data-action="attachments" aria-label="Add attachment"><span data-icon="plus"></span></button><label class="composer-input"><span class="sr-only">Message</span><textarea id="message-input" rows="1" maxlength="2000" placeholder="Message…"></textarea></label><button id="send-message" class="send-button" type="submit" disabled aria-label="Send message"><span data-icon="send"></span></button></form></section>
<nav id="bottom-nav" class="bottom-nav glass" aria-label="Primary navigation"><button data-nav="explore"><span data-icon="explore"></span><span>Explore</span></button><button class="active" data-nav="chats" aria-current="page"><span data-icon="chat"></span><span>Chats</span></button><button data-nav="profile"><span data-icon="profile"></span><span>Profile</span></button></nav></main>
<div id="sheet-root"></div><div id="toast-root" class="toast-root" aria-live="polite"></div><script src="/socket.io/socket.io.js"></script><script src="/js/api.js"></script><script src="/js/dataApi.js"></script><script src="/js/realtime.js"></script><script src="/js/notifications.js"></script><script src="/js/ui.js"></script><script src="/js/app.js"></script></body></html>
